name: Kumanda exe derle

# Bu iş yalnızca başlatıcıyı (launcher.py) derler. Programın kendisi (app/ klasörü)
# her açılışta GitHub'dan indirildiği için app/ değişince yeniden derlemek GEREKMEZ.
# Sadece launcher.py veya gereken kütüphaneler değişirse yeni etiket (v1.1 gibi) aç.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekenleri kur
        run: pip install pyinstaller cryptography

      - name: Derle (klasör modu, antivirüs için daha uygun)
        run: >
          pyinstaller --noconfirm --onedir --console --name Kumanda
          --hidden-import cryptography --hidden-import cryptography.x509
          --hidden-import cryptography.hazmat.primitives.asymmetric.rsa
          launcher.py

      - name: Yedek app klasörünü ve repo adını ekle
        shell: pwsh
        run: |
          Copy-Item app dist/Kumanda/app -Recurse
          Set-Content -Path dist/Kumanda/repo.txt -Value "${{ github.repository }}" -Encoding utf8

      - name: Zip'le
        shell: pwsh
        run: Compress-Archive -Path dist/Kumanda -DestinationPath Kumanda.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Kumanda
          path: Kumanda.zip

      - name: Release'e ekle (yalnızca etiket varsa)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Kumanda.zip
